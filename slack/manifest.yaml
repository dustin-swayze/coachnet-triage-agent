# Slack app manifest for the triage bot (mock-mode demo).
# Use: api.slack.com/apps -> Create New App -> From a manifest -> paste this file.
# Full walkthrough: docs/slack-setup.md
_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Triage Agent (mock)
  description: Read-only triage of partner sync problems (Salesforce, MuleSoft, HubSpot).
  background_color: "#1f3a5f"

features:
  bot_user:
    display_name: triage
    always_online: false # the bot is online only while `python -m triage slack` runs
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true # lets people DM the bot
    messages_tab_read_only_enabled: false # and lets them type in that DM
  slash_commands:
    - command: /triage
      description: Triage a partner sync issue
      usage_hint: case 00412345 looks like a duplicate
      should_escape: false # keep text raw; the bot escapes everything it sends back

oauth_config:
  scopes:
    bot:
      # Each scope is the minimum for one feature. There is no channels:history,
      # groups:history, or users:read, so the bot CANNOT read channel history or
      # browse the workspace. It only sees messages that mention it, slash
      # commands, and DMs sent to it.
      - app_mentions:read # receive "@triage ..." in channels it was invited to
      - chat:write # post and update replies (in channels it is a member of)
      - commands # receive the /triage slash command
      - im:history # receive DM messages sent to the bot (DMs only, not channels)

settings:
  event_subscriptions:
    bot_events:
      - app_mention # "@triage ..." in a channel
      - message.im # a direct message to the bot
  interactivity:
    is_enabled: false # no buttons or menus: the bot is read-only
  org_deploy_enabled: false
  socket_mode_enabled: true # the bot connects out to Slack: no public URL needed
  token_rotation_enabled: false
